name: Deploy to EKS
on:
  push:
    branches:
      - uat

permissions:
  id-token: write    
  contents: read
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 'Checkout GitHub repository'
        uses: actions/checkout@v3
      - name: 'Configure AWS Credentials'
        uses: aws-actions/configure-aws-credentials@v1
        with:
          role-to-assume: arn:aws:iam::779377485839:role/github.to.aws.oicd
          aws-region: ${{ secrets.AWS_REGION }}
      - name: 'Login to Amazon ECR'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: 'Build and Push Image to ECR'
        if: success()
        id: build
        env:
          ENV_SECRETS: ${{ secrets.ENV_SECRETS }}
          APP_CONFIG: ${{ secrets.APP_CONFIG }}
          CERTIFICATE: ${{ secrets.CERTIFICATE }}
          CERTIFICATE_KEY: ${{ secrets.CERTIFICATE_KEY }}
        run: |
          TIMESTAMP=$(date +%Y%m%d%H%M%S)
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY=${{ secrets.ECR_REPOSITORY }}
          IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$TIMESTAMP
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
          # Build the Docker image
          docker build \
            --build-arg ENV_SECRETS="$ENV_SECRETS" \
            --build-arg APP_CONFIG="$APP_CONFIG" \
            --build-arg CERTIFICATE="$CERTIFICATE" \
            --build-arg CERTIFICATE_KEY="$CERTIFICATE_KEY" \
            -t $IMAGE_URI .
          # Push the Docker image to ECR
          docker push $IMAGE_URI
      - name: 'Deploy to EKS'
        if: success()
        env:
          DEPLOYMENT_NAME: dms-frontend-deployment
          AWS_REGION: ${{ secrets.AWS_REGION }}
          EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
        run: |
          # Update kubeconfig
          aws eks update-kubeconfig \
            --region ${AWS_REGION} \
            --name ${EKS_CLUSTER_NAME} 
          # Update the deployment
          kubectl set image deployment/${DEPLOYMENT_NAME} dms-frontend=${IMAGE_URI}
